# Mechanical enforcement (workflow §9): the checks AGENTS.md §Checks names, run on every
# PR and on main. The `consistency` job's name is the status-check context
# `scripts/github-bootstrap.sh` marks required in branch protection — renaming the job
# means updating that script in the same change.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consistency:
    name: consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cross-artifact document consistency
        run: ./scripts/consistency-check.sh

  # CONSTITUTION.md §1.2 makes "a record rides in its PR" non-optional, and workflow §1.4
  # prefers a rule the build enforces over one the model must remember.
  record:
    name: record
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: A task PR carries its own task record
        env:
          # Both refs go through env, never straight into the script: git ref names allow
          # characters the shell would interpret.
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/$BASE_REF"
          # Keep the list on disk and feed it with --stdin: `xargs` behaves differently
          # between GNU and BSD on empty input, and can batch on a very large diff.
          # core.quotePath=false so a non-ASCII path is not quoted and octal-escaped,
          # which would make the protected-surface gate below see nothing.
          git -c core.quotePath=false diff --name-only "$base"...HEAD > /tmp/changed
          count=$(grep -c . /tmp/changed || true)

          if [ "$count" -eq 0 ]; then
            echo "FAIL: this PR changes no files."
            exit 1
          fi

          # Task branches: wip/<id>-<slug>. The id is numeric (a GitHub issue number).
          id=$(printf '%s' "$HEAD_REF" | sed -n -E 's#^wip/([0-9]+)-.+#\1#p')
          if [ -z "$id" ]; then
            echo "FAIL: branch '$HEAD_REF' is not wip/<id>-<slug>."
            exit 1
          fi
          # The bucket is computable from the id (ADR-001 §D4): rounded down to the
          # nearest 100, zero-padded to 6 digits. Checking the exact bucket is what makes
          # that claim true — any-bucket matching would let 999900/142-x.md satisfy task 142.
          bucket=$(printf '%06d' $(( (10#$id / 100) * 100 )))
          if grep -qE "^docs/tasks/${bucket}/${id}-[^/]+\.md$" /tmp/changed; then
            echo "OK: the diff carries the record for task $id at docs/tasks/${bucket}/."
          else
            echo "FAIL: no docs/tasks/${bucket}/${id}-<slug>.md in this diff."
            echo "  Every task PR carries its own record (CONSTITUTION.md §1.2);"
            echo "  a record for another task, or in another bucket, does not satisfy this."
            exit 1
          fi

  # Add the project's build/test command here as a third job once the stack exists —
  # AGENTS.md §Checks item 1 is the single place that names it.
