# Scheduled backstop (issue #13): forge:pr-merge/forge:pr-close (docs/adapters/FORGE.md)
# delete a task's head branch as part of the exact merge/close command run by /t-ship,
# /t-fix, and /t-cancel. If any invocation ever omits the delete-branch flag, the branch
# lingers silently, with nothing else in the repo noticing. This job is that notice.
#
# It only reports: scripts/stale-branches-check.sh never deletes anything itself. A
# failing run means a human looks at the branch list and deletes by hand.
name: Stale branches

on:
  schedule:
    - cron: '17 * * * *' # hourly, offset from :00 to avoid GitHub's peak-minute queue
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  stale-branches:
    name: stale-branches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check for merged/closed PRs whose branch was not deleted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/stale-branches-check.sh
